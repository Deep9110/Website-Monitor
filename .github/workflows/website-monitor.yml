name: Website Monitor

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual scan"
        required: false
        default: "Crawl Now"
  schedule:
    # 10:00 AM India Standard Time = 04:30 UTC
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: website-monitor
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run monitor and email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          echo "=== Maven and website monitoring started ==="
          date -u
          mvn -B -ntp -DskipTests compile exec:java -Dexec.args="${{ github.event_name }}"
          echo "=== Maven and website monitoring finished ==="
          date -u

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-monitor-report
          path: reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 14